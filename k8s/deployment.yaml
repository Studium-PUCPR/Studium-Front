apiVersion: apps/v1
kind: Deployment
metadata:
  name: studium-front
  namespace: studium
  labels:
    app: studium-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studium-front
  template:
    metadata:
      labels:
        app: studium-front
    spec:
      containers:
        - name: studium-front
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: studium-front-service
  namespace: studium
  labels:
    app: studium-front
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: studium-front
